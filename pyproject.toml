[project]
name = "neetcode-150"
version = "0.1.0"
description = "My solutions to the NeetCode 150, each with tests"
readme = "README.md"
authors = [
    { name = "paparici", email = "107882066+paparici@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
addopts = ["--import-mode=importlib"]

[tool.uv.build-backend]
module-name = "neetcode"
module-root = "python"
